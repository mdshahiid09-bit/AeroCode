name: Build AeroCode APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install -g cordova @rspack/cli

      - name: Build Web Assets
        run: |
          node ./utils/config.js prod paid
          npx rspack --mode production

      - name: Build Android APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          cordova platform add android || true
          cordova build android --debug

      - name: Rename APK
        run: |
          mkdir -p build-output
          cp platforms/android/app/build/outputs/apk/debug/*.apk build-output/AeroCode-v1.0.0.apk || true

      - name: Upload APK to GitHub Release v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: build-output/AeroCode-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroCode-v1.0.0-APK
          path: build-output/AeroCode-v1.0.0.apk
